# Static analysis with CodeQL over the whole TypeScript frontend, all of
# which handles untrusted input in this app: pasted HTML, clipboard content,
# and the rendered markup that goes into the live DOM and into exported
# files. Same setup as the desktop app's own codeql.yml.
#
# Code scanning is free on public repositories but needs GitHub Advanced
# Security on private ones, so the job is guarded on visibility as a
# defensive default, though this repository is public today.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload results to the Security tab
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # The default suite plus lower-confidence security queries. This
          # codebase renders untrusted HTML, so extra XSS and injection
          # findings are worth triaging even at some false-positive cost.
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: "/language:${{ matrix.language }}"
